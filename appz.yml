app:
  name: LogCollectorOS
  code: LCOS
  notify: appz@cloudbourne.co

build:
  version: 2.15
  env: DEV
  build_file: none
  output_files: output/*.zip
  image_template: opensearch-2.15

deploy:
  context: alpha/DEV
  type: statefulset 
  replicas: 1
  port:
  - 9200
  - 9300
  - 9600

volumes:
- claim: opensearch-data
  mount: /usr/share/opensearch/data
  name: opensearch-data
  size: 20Gi
  mode: ReadWriteOnce
  class: microk8s-hostpath
monitor:
  notify: appzops@cloudbourne.co     

properties:
  revision : 2
OPENSEARCH_INITIAL_ADMIN_PASSWORD: c*ithE9hoBAst*_oVeprlKewrA#okLSPo
NODE_MODE : multi-node
MAX_RESULT_WINDOW : 10000000
ENABLE_ILM : 1
JAVA_HEAPSIZE : 4g
MIN_AGE_WARM : 2d
MIN_AGE_COLD : 7d
ENABLE_FLUENTD : 0
REPLICA_COUNT : 1
ENABLE_METRICS : 1
# ENABLE_MINIO_BACKUP : 1
# MINIO_BUCKET_NAME : index-snapshot
# MINIO_ENDPOINT : http://minio-2-0:9000
# MINIO_ACCESS_KEY :
